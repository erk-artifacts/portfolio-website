name: Build and Deploy

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify react/react-dom versions match
        run: |
          REACT_VER=$(node -p "require('./node_modules/react/package.json').version")
          REACT_DOM_VER=$(node -p "require('./node_modules/react-dom/package.json').version")
          [ "$REACT_VER" = "$REACT_DOM_VER" ] || { echo "::error::Version mismatch: react@$REACT_VER vs react-dom@$REACT_DOM_VER"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ --force
          git diff --staged --quiet || git commit -m "chore: update build output [skip ci]"
          git push
